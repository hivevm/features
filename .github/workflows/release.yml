name: Release

# Publishes every Feature under src/ to ghcr.io/hivevm/features/<id> when main changes it, after
# the tests pass. A Feature is published at the version its devcontainer-feature.json names, with
# its major and minor tags; a version already published is left as it is.

on:
  push:
    branches: [main]
    paths: ["src/**"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # ghcr.io/hivevm/features
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish only Features that name a release
        run: |
          for dir in src/*/; do
            if [ ! -f "$dir/VERSION" ]; then
              echo "$(basename "$dir") names no release yet; removed from this publication"
              rm -rf "$dir"
            fi
          done
          ls src
      # The CLI the action installs from npm is pinned too; its default is the latest version.
      - uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          publish-features: "true"
          base-path-to-features: ./src
          generate-docs: "false"
          disable-repo-tagging: "true"
          devcontainer-cli-version: "0.89.0"
        env:
          GITHUB_TOKEN: ${{ github.token }}
