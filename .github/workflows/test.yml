name: Test

# Validates every Feature against the specification and installs each one that names a release in
# the base images below, running its test under test/<id>/.

on:
  pull_request:
  workflow_call:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          validate-only: "true"
          base-path-to-features: ./src
          devcontainer-cli-version: "0.89.0"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - mcr.microsoft.com/devcontainers/base:ubuntu
          - mcr.microsoft.com/devcontainers/base:debian
          - alpine:3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the Features that name a release
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          for dir in src/*/; do
            id="$(basename "$dir")"
            if [ ! -f "$dir/VERSION" ]; then
              echo "$id names no release yet; not tested"
              continue
            fi
            npx --yes @devcontainers/cli@0.89.0 features test --features "$id" --base-image "$IMAGE" .
          done
